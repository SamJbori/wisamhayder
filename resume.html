<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisam Hayder - Resume</title>

  <meta name="description"
    content="Executive resume of Wisam Hayder - Head of IT & Enterprise Infrastructure Architect.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://samjbori.github.io/wisamhayder/resume.html">
  <meta property="og:title" content="Wisam Hayder - Executive Resume & CV">
  <meta property="og:description"
    content="Printable executive resume of Wisam Hayder - Head of Information Technology.">
  <meta property="og:image" content="https://samjbori.github.io/wisamhayder/profile.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary: #0f172a;
      --secondary: #334155;
      --accent: #0284c7;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg-card: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background-color: #f1f5f9;
      line-height: 1.5;
      font-size: 13.5px;
      -webkit-font-smoothing: antialiased;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, .95);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
    }

    .toolbar a,
    .toolbar button {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, .25);
      padding: 6px 14px;
      border-radius: 6px;
      background: 0 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .2s;
    }

    .toolbar a:hover,
    .toolbar button:hover {
      background: rgba(255, 255, 255, .15);
    }

    .toolbar .btn-print {
      background: #0284c7;
      border-color: #0284c7;
      font-weight: 600;
    }

    .toolbar .btn-print:hover {
      background: #0369a1;
    }

    .document-page {
      max-width: 900px;
      margin: 24px auto;
      background: #fff;
      padding: 40px 48px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, .08);
      border-radius: 8px;
    }

    .header-table {
      display: flex;
      align-items: center;
      gap: 28px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 24px;
      margin-bottom: 24px;
    }

    .profile-photo-wrapper {
      width: 100px;
      height: 100px;
      aspect-ratio: 1/1;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border);
      flex-shrink: 0;
      position: relative;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-fallback-box {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
    }

    .profile-fallback-box .initials {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
    }

    .profile-fallback-box .caption {
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .header-details {
      flex: 1;
    }

    .header-details h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -.5px;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .header-details .headline {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .contact-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12.5px;
      color: var(--secondary);
    }

    .contact-bar a {
      color: inherit;
      text-decoration: none;
      font-weight: 500;
    }

    .contact-bar a:hover {
      color: var(--accent);
    }

    .section-title {
      font-size: 13.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--primary);
      border-bottom: 1.5px solid var(--border);
      padding-bottom: 4px;
      margin-top: 24px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
    }

    .summary-text {
      color: var(--secondary);
      font-size: 13px;
      text-align: justify;
      line-height: 1.6;
    }

    .skills-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 20px;
      font-size: 12px;
    }

    .skill-category {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
    }

    .skill-category-name {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 2px;
    }

    .skill-category-items {
      color: var(--secondary);
      line-height: 1.45;
    }

    .job-entry {
      margin-bottom: 18px;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2px;
    }

    .job-company {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .job-role {
      font-weight: 600;
      color: var(--accent);
      font-size: 13px;
    }

    .job-date-location {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      text-align: right;
    }

    .job-bullets {
      margin-top: 6px;
      padding-left: 18px;
      color: var(--secondary);
      font-size: 12.5px;
    }

    .job-bullets li {
      margin-bottom: 3px;
      line-height: 1.5;
    }

    .job-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .tag-badge {
      font-size: 10.5px;
      background: #f1f5f9;
      color: #475569;
      padding: 1px 7px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      font-weight: 500;
    }

    .edu-entry {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
    }

    .edu-degree {
      font-weight: 700;
      color: var(--primary);
    }

    .edu-school {
      color: var(--secondary);
    }

    .ats-hidden-layer {
      font-size: .1pt !important;
      line-height: .01 !important;
      color: transparent !important;
      opacity: .01 !important;
      user-select: none;
      height: 1px;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm 12mm;
      }

      body {
        background: #fff;
        font-size: 12px;
        line-height: 1.45;
        color: #000;
      }

      .no-print {
        display: none !important;
      }

      .document-page {
        box-shadow: none;
        padding: 0;
        margin: 0;
        max-width: 100%;
      }

      .section-title {
        margin-top: 16px;
        margin-bottom: 8px;
        border-bottom-color: #000;
      }

      .job-entry {
        margin-bottom: 12px;
        page-break-inside: avoid;
        break-inside: avoid;
      }

      .skills-container {
        gap: 6px 12px;
      }

      .skill-category {
        padding: 4px 8px;
        border-color: #ddd;
        background: #fafafa;
      }

      a {
        text-decoration: none;
        color: inherit;
      }
    }
  </style>
</head>

<body>

  <!-- Screen Toolbar -->
  <div class="no-print toolbar">
    <div style="font-weight:700; font-size:14px;">Wisam Hayder • Printable Executive Resume</div>
    <div style="display:flex; gap:10px;">
      <a href="index.html">← Back to Portfolio</a>
      <button class="btn-print" onclick="window.print()">🖶 Print / Save as PDF</button>
    </div>
  </div>

  <main class="document-page" id="resume-container"></main>

  <!-- Load Data Source -->
  <script src="data.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.RESUME_DATA) {
        document.getElementById("resume-container").innerHTML = "<p style='color:red;'>Error: data.js not found.</p>";
        return;
      }
      const o = window.RESUME_DATA;
      const t = document.getElementById("resume-container");

      const headerHtml = `
        <header class="header-table">
          <div class="profile-photo-wrapper">
            <img src="${o.personal.profileImage}" alt="${o.personal.name}" class="profile-photo" onerror="this.style.display='none'; document.getElementById('resume-fallback').style.display='flex';">
            <div id="resume-fallback" class="profile-fallback-box" style="display:none;">
              <span class="initials">${o.personal.initials || 'WH'}</span>
              <span class="caption">Wisam Hayder</span>
            </div>
          </div>
          <div class="header-details">
            <h1>${o.personal.name}</h1>
            <div class="headline">${o.personal.headline}</div>
            <div class="contact-bar">
              <span>&#128205; ${o.personal.shortLocation}</span>
              <span>&#9742; <a href="tel:${o.personal.phoneClean}">${o.personal.phone}</a></span>
              <span>&#9993; <a href="mailto:${o.personal.email}">${o.personal.email}</a></span>
              <span><a href="${o.personal.links.linkedin}" target="_blank">LinkedIn</a></span>
              <span><a href="${o.personal.links.github}" target="_blank">GitHub</a></span>
              <span><a href="${o.personal.links.instagram}" target="_blank">Instagram</a></span>
            </div>
          </div>
        </header>
      `;

      const summaryHtml = `
        <section>
          <div class="section-title">Executive Profile</div>
          <p class="summary-text">${o.summary}</p>
        </section>
      `;

      const compHtml = `
        <section>
          <div class="section-title">Core Competencies & Technical Expertise</div>
          <div class="skills-container">
            ${o.competencies.map(e => `
              <div class="skill-category">
                <div class="skill-category-name">${e.title || e.category}</div>
                <div class="skill-category-items">${e.skills.join(" &bull; ")}</div>
              </div>
            `).join("")}
          </div>
        </section>
      `;

      const expHtml = `
        <section>
          <div class="section-title">Professional Experience</div>
          ${o.experience.map(e => `
            <div class="job-entry">
              <div class="job-header">
                <div>
                  <span class="job-company">${e.company}</span> &mdash; 
                  <span class="job-role">${e.role}</span>${e.note ? `<div style="font-size:11px; color:#64748b; font-style:italic;">${e.note}</div>` : ""}
                </div>
                <div class="job-date-location">${e.location} \vert{}${e.period}</div>
              </div>
              <ul class="job-bullets">
                ${e.highlights.map(h => `<li>${h}</li>`).join("")}
              </ul>
              <div class="job-tags">
                ${e.tags.map(t => `<span class="tag-badge">${t}</span>`).join("")}
              </div>
            </div>
          `).join("")}
        </section>
      `;

      const eduHtml = `
        <section>
          <div class="section-title">Education & Credentials</div>
          ${o.education.map(e => `
            <div class="edu-entry">
              <div>
                <span class="edu-degree">${e.degree}</span> &mdash; 
                <span class="edu-school">${e.institution}</span>
              </div>
              <span style="color:#64748b; font-size:12px;">${e.location}</span>
            </div>
          `).join("")}
        </section>
      `;

      const atsLayerHtml = `
        <div class="ats-hidden-layer" aria-hidden="true">
          ${(o.atsTaxonomy || []).join(" ")}
        </div>
      `;

      t.innerHTML = headerHtml + summaryHtml + compHtml + expHtml + eduHtml + atsLayerHtml;
    });
  </script>
</body>

</html>
